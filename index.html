<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Score Fléchette</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: #0f1115; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
    body { display: flex; justify-content: center; user-select: none; }
    .app { width: 100%; max-width: 430px; min-height: 100dvh; padding: 24px 16px 12px; display: flex; flex-direction: column; background: radial-gradient(circle at top, #1a1f29 0%, #0f1115 60%); color: white; }
    .top { height: 300px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    .history { height: 84px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font-size: 24px; line-height: 1.15; font-weight: 900; font-variant-numeric: tabular-nums; text-align: center; }
    .score { margin-top: 8px; font-size: 116px; line-height: .9; font-weight: 900; letter-spacing: -0.08em; font-variant-numeric: tabular-nums; text-shadow: 0 8px 30px rgba(255,255,255,.12); }
    .current { height: 48px; margin-top: 28px; font-size: 26px; line-height: 1; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; max-width: 100%; overflow: hidden; }
    .pad { margin-top: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 12px; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .bottom { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 4px; }
    button { border: 0; color: white; font-weight: 900; cursor: pointer; touch-action: manipulation; }
    .num { height: 74px; border-radius: 24px; background: linear-gradient(to bottom, #34d058, #179637); border: 1px solid #53ef78; box-shadow: 0 10px 25px rgba(20,140,50,.45), inset 0 1px 0 rgba(255,255,255,.3); font-size: 25px; }
    .erase { height: 74px; border-radius: 24px; background: linear-gradient(to bottom, #ff4d5d, #d90019); border: 1px solid #ff7b87; box-shadow: 0 10px 25px rgba(255,0,50,.4), inset 0 1px 0 rgba(255,255,255,.25); font-size: 48px; display: flex; align-items: center; justify-content: center; }
    .new { height: 82px; border-radius: 28px; background: linear-gradient(to bottom, #ff4d5d, #d70018); border: 1px solid #ff7d88; box-shadow: 0 14px 30px rgba(255,0,40,.35), inset 0 1px 0 rgba(255,255,255,.25); font-size: 20px; letter-spacing: -0.02em; }
    .enter { height: 82px; border-radius: 28px; background: linear-gradient(to bottom, #4f4dff, #1600d8); border: 1px solid #7f84ff; box-shadow: 0 14px 30px rgba(40,50,255,.4), inset 0 1px 0 rgba(255,255,255,.25); font-size: 30px; letter-spacing: -0.03em; }
    button:active { transform: scale(.95); filter: brightness(.9); }
    .bottom button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <main class="app">
    <section class="top">
      <div class="history" id="history"></div>
      <div class="score" id="score">301</div>
      <div class="current" id="current"></div>
    </section>
    <section class="pad" id="pad"></section>
    <div class="bottom">
      <button class="new" id="newGame">Nouvelle Partie</button>
      <button class="enter" id="enter">Entrée</button>
    </div>
  </main>
  <script>
    const START_SCORE = 301;
    let score = START_SCORE;
    let currentThrow = [];
    let history = [];
    const scoreEl = document.getElementById('score');
    const currentEl = document.getElementById('current');
    const historyEl = document.getElementById('history');
    const padEl = document.getElementById('pad');
    const rows = [[25, 50], [1, 6, 11, 16], [2, 7, 12, 17], [3, 8, 13, 18], [4, 9, 14, 19], [5, 10, 15, 20]];
    function total() { return currentThrow.reduce((a, b) => a + b, 0); }
    function render() {
      scoreEl.textContent = score;
      currentEl.textContent = currentThrow.length ? '-' + currentThrow.join('-') : '';
      historyEl.innerHTML = history.length ? `<div>${history[0].line}</div><div>= ${history[0].total}</div>` : '';
    }
    function addValue(value) {
      if (currentThrow.length >= 9) return;
      currentThrow.push(value);
      render();
    }
    function enterThrow() {
      if (!currentThrow.length) return;
      const currentTotal = total();
      if (currentTotal > score) return;
      score -= currentTotal;
      history = [{ line: '-' + currentThrow.join('-'), total: currentTotal, values: [...currentThrow] }];
      currentThrow = [];
      render();
    }
    function erase() {
      if (currentThrow.length) {
        currentThrow.pop();
      } else if (history.length) {
        const previous = history[0];
        score = Math.min(START_SCORE, score + previous.total);
        currentThrow = [...previous.values];
        history = [];
      }
      render();
    }
    function newGame() {
      score = START_SCORE;
      currentThrow = [];
      history = [];
      render();
    }
    rows.forEach((row, index) => {
      const div = document.createElement('div');
      div.className = 'grid4';
      if (index === 0) {
        div.appendChild(document.createElement('div'));
        row.forEach(v => {
          const b = document.createElement('button'); b.className = 'num'; b.textContent = v; b.onclick = () => addValue(v); div.appendChild(b);
        });
        const eraseBtn = document.createElement('button'); eraseBtn.className = 'erase'; eraseBtn.textContent = '←'; eraseBtn.onclick = erase; div.appendChild(eraseBtn);
      } else {
        row.forEach(v => {
          const b = document.createElement('button'); b.className = 'num'; b.textContent = v; b.onclick = () => addValue(v); div.appendChild(b);
        });
      }
      padEl.appendChild(div);
    });
    document.getElementById('enter').onclick = enterThrow;
    document.getElementById('newGame').onclick = newGame;
    render();
  </script>
</body>
</html>
