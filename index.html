<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Flechette Score</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f1115;
      overflow:hidden;
      touch-action:manipulation;
    }

    .app{
      width:100%;
      max-width:430px;
      height:100svh;
      margin:auto;
      padding:12px 12px 8px;
      display:flex;
      flex-direction:column;
      background:radial-gradient(circle at top,#1a1f29 0%,#0f1115 60%);
    }

    .top{
      height:190px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      align-items:center;
      flex-shrink:0;
    }

    .history{
      height:58px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      align-items:center;
      font-size:19px;
      line-height:1.05;
      font-weight:900;
      color:white;
      text-align:center;
    }

    .score{
      margin-top:4px;
      font-size:92px;
      line-height:.86;
      font-weight:900;
      letter-spacing:-0.08em;
      color:white;
      text-shadow:0 8px 30px rgba(255,255,255,.12);
    }

    .current{
      height:28px;
      margin-top:8px;
      font-size:21px;
      line-height:1;
      font-weight:900;
      color:white;
      text-align:center;
      white-space:nowrap;
    }

    .keyboard{
      margin-top:8px;
      margin-bottom:8px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .row{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }

    .button{
      height:54px;
      border:none;
      border-radius:18px;
      color:white;
      font-size:21px;
      font-weight:900;
      transition:all .1s;
      transform:scale(1);
    }

    .button:active{
      transform:scale(.9);
      filter:brightness(1.25);
    }

    .green{
      background:linear-gradient(to bottom,#34d058,#179637);
      border:1px solid #53ef78;
      box-shadow:
        0 10px 25px rgba(20,140,50,.45),
        inset 0 1px 0 rgba(255,255,255,.3);
    }

    .red{
      background:linear-gradient(to bottom,#ff4d5d,#d90019);
      border:1px solid #ff7b87;
      box-shadow:
        0 10px 25px rgba(255,0,50,.4),
        inset 0 1px 0 rgba(255,255,255,.25);
    }

    .blue{
      background:linear-gradient(to bottom,#4f4dff,#1600d8);
      border:1px solid #7f84ff;
      box-shadow:
        0 14px 30px rgba(40,50,255,.4),
        inset 0 1px 0 rgba(255,255,255,.25);
    }

    .erase{
      font-size:38px;
    }

    .bottom{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:auto;
    }

    .bottom .button{
      height:58px;
      border-radius:20px;
    }

    .new-game{
      font-size:16px;
    }

    .enter{
      font-size:24px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">

    <div class="history" id="history"></div>

    <div class="score" id="score">
      301
    </div>

    <div class="current" id="current"></div>

  </div>

  <div class="keyboard">

    <div class="row">
      <div></div>

      <button class="button green" onclick="addValue(25)">
        25
      </button>

      <button class="button green" onclick="addValue(50)">
        50
      </button>

      <button class="button red erase" onclick="eraseValue()">
        ←
      </button>
    </div>

    <div class="row">
      <button class="button green" onclick="addValue(1)">1</button>
      <button class="button green" onclick="addValue(6)">6</button>
      <button class="button green" onclick="addValue(11)">11</button>
      <button class="button green" onclick="addValue(16)">16</button>
    </div>

    <div class="row">
      <button class="button green" onclick="addValue(2)">2</button>
      <button class="button green" onclick="addValue(7)">7</button>
      <button class="button green" onclick="addValue(12)">12</button>
      <button class="button green" onclick="addValue(17)">17</button>
    </div>

    <div class="row">
      <button class="button green" onclick="addValue(3)">3</button>
      <button class="button green" onclick="addValue(8)">8</button>
      <button class="button green" onclick="addValue(13)">13</button>
      <button class="button green" onclick="addValue(18)">18</button>
    </div>

    <div class="row">
      <button class="button green" onclick="addValue(4)">4</button>
      <button class="button green" onclick="addValue(9)">9</button>
      <button class="button green" onclick="addValue(14)">14</button>
      <button class="button green" onclick="addValue(19)">19</button>
    </div>

    <div class="row">
      <button class="button green" onclick="addValue(5)">5</button>
      <button class="button green" onclick="addValue(10)">10</button>
      <button class="button green" onclick="addValue(15)">15</button>
      <button class="button green" onclick="addValue(20)">20</button>
    </div>

  </div>

  <div class="bottom">

    <button class="button red new-game" onclick="newGame()">
      Nouvelle Partie
    </button>

    <button class="button blue enter" onclick="enterThrow()">
      Entrée
    </button>

  </div>

</div>

<script>

let score = 301;
let currentThrow = [];
let history = null;

const scoreEl = document.getElementById("score");
const currentEl = document.getElementById("current");
const historyEl = document.getElementById("history");

function vibrate(){
  if(navigator.vibrate){
    navigator.vibrate(12);
  }
}

function updateUI(){

  scoreEl.innerText = score;

  currentEl.innerText =
    currentThrow.length > 0
      ? "-" + currentThrow.join("-")
      : "";

  if(history){
    historyEl.innerHTML = `
      <div>${history.line}</div>
      <div>= ${history.total}</div>
    `;
  }else{
    historyEl.innerHTML = "";
  }
}

function addValue(value){

  vibrate();

  if(currentThrow.length >= 9){
    return;
  }

  currentThrow.push(value);

  updateUI();
}

function enterThrow(){

  vibrate();

  if(currentThrow.length === 0){
    return;
  }

  const total =
    currentThrow.reduce((a,b)=>a+b,0);

  if(total > score){
    return;
  }

  score -= total;

  history = {
    line:"-" + currentThrow.join("-"),
    total:total,
    values:[...currentThrow]
  };

  currentThrow = [];

  updateUI();
}

function eraseValue(){

  vibrate();

  if(currentThrow.length > 0){

    currentThrow.pop();

    updateUI();

    return;
  }

  if(history){

    score += history.total;

    currentThrow = [...history.values];

    history = null;

    updateUI();
  }
}

function newGame(){

  vibrate();

  score = 301;

  currentThrow = [];

  history = null;

  updateUI();
}

updateUI();

</script>

</body>
</html>
