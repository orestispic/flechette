<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fléchette Score</title>

  <style>
    :root {
      color-scheme: dark;
      --bg-top: #09122b;
      --bg-bottom: #040a19;
      --panel-top: #163766;
      --panel-bottom: #0a1433;
      --panel-line: rgba(81, 180, 255, .46);
      --panel-glow: rgba(31, 144, 255, .26);
      --text: #f6f9ff;
      --muted: #a7b8df;
      --teal-top: #17687d;
      --teal-bottom: #083748;
      --teal-line: #36f2ef;
      --purple-top: #8f61ff;
      --purple-bottom: #4e27c9;
      --pink-top: #f755b0;
      --pink-bottom: #b20f73;
      --cyan-top: #27bffc;
      --cyan-bottom: #0d7df1;
      --action-top: #1b2557;
      --action-bottom: #11193d;
      --radius-panel: 18px;
      --radius-key: 15px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% -10%, rgba(66, 132, 255, .22), transparent 34%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      overscroll-behavior: none;
    }

    body {
      font-family: "SF Pro Display", "Aptos", "Segoe UI", sans-serif;
      color: var(--text);
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button {
      font: inherit;
    }

    .app {
      position: relative;
      width: min(100vw, 460px);
      height: 100svh;
      min-height: 100svh;
      margin: 0 auto;
      padding: calc(14px + var(--safe-top)) 14px calc(18px + var(--safe-bottom));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      background:
        radial-gradient(circle at 12% 18%, rgba(62, 123, 255, .16), transparent 22%),
        radial-gradient(circle at 82% 34%, rgba(65, 219, 255, .08), transparent 28%),
        linear-gradient(180deg, rgba(6, 15, 43, .96), rgba(2, 7, 20, .98));
      overflow: hidden;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(255,255,255,.065), transparent 28%),
        radial-gradient(circle at 50% 8%, rgba(66, 132, 255, .18), transparent 26%);
      opacity: .9;
    }

    .scoreboard {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
      padding: 14px;
      min-block-size: clamp(224px, 29svh, 292px);
      border: 1px solid var(--panel-line);
      border-radius: var(--radius-panel);
      background:
        radial-gradient(circle at 0% 0%, rgba(89, 180, 255, .12), transparent 32%),
        linear-gradient(180deg, rgba(28, 58, 104, .95), rgba(8, 18, 48, .98));
      box-shadow:
        0 0 0 1px rgba(139, 215, 255, .12) inset,
        0 12px 36px rgba(0, 0, 0, .34),
        0 0 30px var(--panel-glow);
      overflow: hidden;
    }

    .scoreboard::before {
      content: "";
      position: absolute;
      left: -12%;
      right: -12%;
      bottom: 36px;
      height: 124px;
      border-radius: 50%;
      background:
        linear-gradient(180deg, rgba(29, 67, 146, .22), rgba(15, 31, 79, .54)),
        radial-gradient(circle at 85% 68%, rgba(39, 64, 219, .42), transparent 30%);
      transform: rotate(2deg);
      pointer-events: none;
    }

    .scoreboard::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #2ca8ff 24%, #275cff 78%, transparent);
      box-shadow: 0 0 20px rgba(41, 144, 255, .55);
    }

    .status-row,
    .meta-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .status-row {
      justify-content: space-between;
      gap: 10px;
    }

    .pill,
    .hint {
      min-height: 32px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      border: 1px solid rgba(95, 153, 255, .3);
      background: linear-gradient(180deg, rgba(19, 47, 100, .9), rgba(14, 31, 78, .82));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      color: #8fd1ff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .voice-toggle {
      min-width: 104px;
      gap: 8px;
      color: #d9efff;
      cursor: pointer;
      transition: filter .14s ease, box-shadow .14s ease, transform .14s ease;
    }

    .voice-toggle:active,
    .voice-toggle.pressed {
      transform: translateY(1px);
      filter: brightness(1.08);
    }

    .voice-toggle.listening {
      border-color: rgba(83, 242, 206, .6);
      color: #ecfffa;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1),
        0 0 18px rgba(64, 229, 186, .2);
    }

    .voice-toggle.error {
      border-color: rgba(255, 114, 160, .55);
      color: #ffd9e7;
    }

    .voice-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.92), rgba(165,214,255,.35));
      box-shadow: 0 0 0 3px rgba(136, 190, 255, .12);
      flex: 0 0 18px;
    }

    .score-wrap {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 18px 0 12px;
    }

    .score {
      max-width: 100%;
      font-size: clamp(92px, 20vw, 128px);
      line-height: .82;
      font-weight: 800;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      color: #eef5ff;
      text-shadow:
        0 0 18px rgba(164, 208, 255, .15),
        0 10px 28px rgba(4, 10, 32, .45);
      transform-origin: center;
    }

    .score.score-pop {
      animation: scorePop .34s cubic-bezier(.16, 1, .3, 1);
    }

    @keyframes scorePop {
      0% { transform: translateY(4px) scale(.965); opacity: .82; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .meta-row {
      gap: 0;
      justify-content: flex-start;
    }

    .turn-line {
      flex: 1 1 100%;
      min-width: 0;
      min-height: 36px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      border-radius: 11px;
      border: 1px solid rgba(110, 116, 255, .42);
      background: linear-gradient(180deg, rgba(18, 28, 78, .84), rgba(11, 16, 51, .8));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
      color: #d9e1ff;
      font-size: clamp(12px, 2.7vw, 14px);
      line-height: 1;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .turn-line strong {
      font-weight: 700;
      color: #f8fbff;
    }

    .turn-line.warn {
      color: #ffe0ea;
      border-color: rgba(255, 100, 158, .55);
      background: linear-gradient(180deg, rgba(104, 30, 68, .92), rgba(64, 18, 49, .9));
      animation: shake .28s ease-in-out;
    }

    .hint {
      flex: 0 0 auto;
      color: #f4f8ff;
      font-weight: 600;
    }

    .hint.warn {
      color: #ffd1da;
      border-color: rgba(255, 99, 160, .45);
      background: linear-gradient(180deg, rgba(83, 24, 57, .92), rgba(57, 15, 42, .86));
      animation: shake .24s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .keypad {
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      min-height: 0;
    }

    .spacer {
      min-width: 0;
    }

    .button {
      --press-glow: rgba(68, 232, 237, .3);
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 0;
      height: 100%;
      border: 1px solid rgba(68, 232, 237, .92);
      border-radius: var(--radius-key);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #f2f7ff;
      font-size: clamp(23px, 7vw, 28px);
      font-weight: 700;
      letter-spacing: -.02em;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        0 10px 24px rgba(0, 0, 0, .24);
      transition: transform .09s ease, filter .09s ease, box-shadow .09s ease;
    }

    .button::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.12), transparent 32%),
        radial-gradient(circle at 50% 115%, rgba(0,0,0,.28), transparent 58%);
      pointer-events: none;
    }

    .button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .button:active,
    .button.pressed {
      transform: translateY(2px) scale(.972);
      filter: brightness(1.08) saturate(1.08);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 6px 14px rgba(0, 0, 0, .2),
        0 0 18px var(--press-glow);
    }

    .green {
      --press-glow: rgba(54, 242, 239, .34);
      background: linear-gradient(180deg, var(--teal-top), var(--teal-bottom));
    }

    .gold {
      --press-glow: rgba(155, 109, 255, .38);
      border-color: rgba(170, 130, 255, .96);
      background: linear-gradient(180deg, var(--purple-top), var(--purple-bottom));
    }

    .red {
      --press-glow: rgba(255, 85, 176, .38);
      border-color: rgba(255, 110, 200, .94);
      background: linear-gradient(180deg, var(--pink-top), var(--pink-bottom));
    }

    .blue {
      --press-glow: rgba(39, 191, 252, .4);
      border-color: rgba(98, 208, 255, .92);
      background: linear-gradient(180deg, var(--cyan-top), var(--cyan-bottom));
    }

    .erase {
      font-size: clamp(32px, 8vw, 40px);
      padding-bottom: 4px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      gap: 10px;
      min-height: 68px;
    }

    .actions .button {
      min-height: 0;
      height: 100%;
      font-size: clamp(16px, 4.4vw, 18px);
      justify-content: flex-start;
      padding: 0 20px;
    }

    .actions .red {
      border-color: rgba(84, 109, 220, .55);
      background: linear-gradient(180deg, rgba(35, 48, 112, .96), rgba(20, 28, 69, .98));
    }

    .actions .button span {
      position: relative;
      z-index: 1;
    }

    .action-icon {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      border: 1px solid rgba(191, 211, 255, .45);
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
      font-size: 24px;
      line-height: 1;
      color: #eff5ff;
    }

    .enter {
      justify-content: center !important;
      font-size: clamp(18px, 4.8vw, 20px) !important;
    }

    .enter .action-icon {
      width: auto;
      height: auto;
      border: 0;
      background: transparent;
      box-shadow: none;
      font-size: 32px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-height: 860px) {
      .app {
        gap: 12px;
      }

      .scoreboard {
        min-block-size: clamp(214px, 28svh, 268px);
      }

      .button {
        font-size: clamp(22px, 6.2vw, 27px);
      }

      .actions,
      .actions .button {
        min-height: 64px;
      }
    }

    @media (max-width: 390px) {
      .app {
        padding-left: 10px;
        padding-right: 10px;
      }

      .scoreboard {
        padding: 12px;
      }

      .keypad,
      .row {
        gap: 6px;
      }

      .turn-line {
        font-size: 11px;
      }

      .actions .button {
        padding: 0 16px;
        font-size: 15px;
      }

      .voice-toggle {
        min-width: 92px;
        padding: 0 10px;
        font-size: 11px;
      }

      .action-icon {
        width: 28px;
        height: 28px;
        flex-basis: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app" aria-label="Compteur de score fléchette">
    <section class="scoreboard" aria-live="polite">
      <div class="status-row">
        <button class="pill voice-toggle" id="voiceToggle" type="button" aria-pressed="false">
          <span class="voice-icon" aria-hidden="true"></span>
          <span id="voiceLabel">Score OFF</span>
        </button>
        <div class="pill" id="lastThrow">Aucune manche</div>
      </div>

      <div class="score-wrap">
        <div class="score" id="score">301</div>
      </div>

      <div class="meta-row">
        <div class="turn-line" id="current">Tour vide</div>
        <div class="sr-only" id="hint" aria-hidden="true">Reste 301</div>
      </div>
    </section>

    <section class="keypad" aria-label="Clavier de points">
      <div class="row">
        <div class="spacer" aria-hidden="true"></div>
        <button class="button gold" type="button" data-value="25" aria-label="Ajouter 25 points">25</button>
        <button class="button gold" type="button" data-value="50" aria-label="Ajouter 50 points">50</button>
        <button class="button red erase" type="button" data-action="erase" aria-label="Effacer ou annuler">←</button>
      </div>

      <div class="row">
        <button class="button green" type="button" data-value="1">1</button>
        <button class="button green" type="button" data-value="6">6</button>
        <button class="button green" type="button" data-value="11">11</button>
        <button class="button green" type="button" data-value="16">16</button>
      </div>

      <div class="row">
        <button class="button green" type="button" data-value="2">2</button>
        <button class="button green" type="button" data-value="7">7</button>
        <button class="button green" type="button" data-value="12">12</button>
        <button class="button green" type="button" data-value="17">17</button>
      </div>

      <div class="row">
        <button class="button green" type="button" data-value="3">3</button>
        <button class="button green" type="button" data-value="8">8</button>
        <button class="button green" type="button" data-value="13">13</button>
        <button class="button green" type="button" data-value="18">18</button>
      </div>

      <div class="row">
        <button class="button green" type="button" data-value="4">4</button>
        <button class="button green" type="button" data-value="9">9</button>
        <button class="button green" type="button" data-value="14">14</button>
        <button class="button green" type="button" data-value="19">19</button>
      </div>

      <div class="row">
        <button class="button green" type="button" data-value="5">5</button>
        <button class="button green" type="button" data-value="10">10</button>
        <button class="button green" type="button" data-value="15">15</button>
        <button class="button green" type="button" data-value="20">20</button>
      </div>
    </section>

    <section class="actions" aria-label="Actions">
      <button class="button red" type="button" data-action="new">
        <span class="action-icon" aria-hidden="true">+</span>
        <span>Nouvelle partie</span>
      </button>
      <button class="button blue enter" type="button" data-action="enter">
        <span class="action-icon" aria-hidden="true">→</span>
        <span>Entrée</span>
      </button>
    </section>
  </main>

  <script>
    const START_SCORE = 301;
    const MAX_VALUES = 9;

    let score = START_SCORE;
    let currentThrow = [];
    let history = null;
    let displayedScore = START_SCORE;
    let scoreAnimation = null;
    let voiceEnabled = false;
    let voiceListening = false;
    let voiceArmed = false;
    let voicePausedForSpeech = false;
    let voiceRestartTimer = null;
    const scoreEl = document.getElementById("score");
    const currentEl = document.getElementById("current");
    const lastThrowEl = document.getElementById("lastThrow");
    const hintEl = document.getElementById("hint");
    const voiceToggleEl = document.getElementById("voiceToggle");
    const voiceLabelEl = document.getElementById("voiceLabel");

    const supportsFineHaptics = typeof navigator.vibrate === "function";
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    const supportsVoiceRecognition = typeof SpeechRecognitionCtor === "function";
    const voiceRecognition = supportsVoiceRecognition ? new SpeechRecognitionCtor() : null;
    const speechSynthesisSupported = "speechSynthesis" in window;

    const NUMBER_WORDS = {
      zero: 0,
      un: 1,
      une: 1,
      deux: 2,
      trois: 3,
      quatre: 4,
      cinq: 5,
      six: 6,
      sept: 7,
      huit: 8,
      neuf: 9,
      dix: 10,
      onze: 11,
      douze: 12,
      treize: 13,
      quatorze: 14,
      quinze: 15,
      seize: 16,
      dixsept: 17,
      dixhuit: 18,
      dixneuf: 19,
      vingt: 20,
      trente: 30,
      quarante: 40,
      cinquante: 50,
      soixante: 60
    };

    const DIRECT_NUMBER_COMMANDS = {
      bull: 25,
      centre: 50
    };

    if (voiceRecognition) {
      voiceRecognition.lang = "fr-FR";
      voiceRecognition.continuous = true;
      voiceRecognition.interimResults = false;
      voiceRecognition.maxAlternatives = 1;
    }

    function vibrate(pattern = 12) {
      if (supportsFineHaptics) {
        return navigator.vibrate(pattern);
      }
      return false;
    }

    function normalizeVoiceText(text) {
      return text
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[.,;:!?]/g, " ")
        .replace(/[-\u2010-\u2015]/g, " ")
        .replace(/[']/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function updateVoiceUI(status = "off") {
      if (!voiceToggleEl || !voiceLabelEl) return;

      voiceToggleEl.classList.remove("listening", "error");
      voiceToggleEl.setAttribute("aria-pressed", voiceEnabled ? "true" : "false");

      if (!supportsVoiceRecognition) {
        voiceLabelEl.textContent = "Score indispo";
        voiceToggleEl.classList.add("error");
        voiceToggleEl.disabled = true;
        return;
      }

      if (status === "error") {
        voiceLabelEl.textContent = "Score erreur";
        voiceToggleEl.classList.add("error");
      } else if (voiceListening && voiceArmed) {
        voiceLabelEl.textContent = "Score prêt";
        voiceToggleEl.classList.add("listening");
      } else if (voiceListening) {
        voiceLabelEl.textContent = "Score ON";
        voiceToggleEl.classList.add("listening");
      } else if (voiceEnabled) {
        voiceLabelEl.textContent = "Score veille";
      } else {
        voiceLabelEl.textContent = "Score OFF";
      }
    }

    function speak(text, options = {}) {
      if (!speechSynthesisSupported || !text) return;

      const { resumeListening = true } = options;

      if (voiceRecognition && voiceListening) {
        voicePausedForSpeech = true;
        try {
          voiceRecognition.stop();
        } catch (error) {
          voicePausedForSpeech = false;
        }
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "fr-FR";
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.onend = () => {
        voicePausedForSpeech = false;
        if (resumeListening && voiceEnabled) {
          scheduleVoiceRestart();
        }
      };
      utterance.onerror = () => {
        voicePausedForSpeech = false;
        if (resumeListening && voiceEnabled) {
          scheduleVoiceRestart();
        }
      };
      window.speechSynthesis.speak(utterance);
    }

    function parseVoiceToken(tokens, index) {
      const token = tokens[index];
      const nextToken = tokens[index + 1] || "";

      if (!token) return null;

      if (token === "score") {
        return { type: "arm", step: 1 };
      }

      if (DIRECT_NUMBER_COMMANDS[token] !== undefined) {
        return { type: "value", value: DIRECT_NUMBER_COMMANDS[token], step: 1 };
      }

      if (/^\d$/.test(token)) {
        return { type: "value", value: Number(token), step: 1 };
      }

      if (/^2[1-9]$/.test(token) && token !== "25") {
        return {
          type: "sequence",
          actions: [
            { type: "value", value: 20 },
            { type: "value", value: Number(token[1]) }
          ],
          step: 1
        };
      }

      if (/^(1[0-9]|20|25|30|40|50|60)$/.test(token)) {
        return { type: "value", value: Number(token), step: 1 };
      }

      const combined = `${token}${nextToken}`;
      if (NUMBER_WORDS[combined] !== undefined) {
        return { type: "value", value: NUMBER_WORDS[combined], step: 2 };
      }

      if ((token === "vingt" || token === "cinquante") && nextToken === "cinq") {
        return { type: "value", value: token === "vingt" ? 25 : 55, step: 2 };
      }

      if (NUMBER_WORDS[token] !== undefined) {
        return { type: "value", value: NUMBER_WORDS[token], step: 1 };
      }

      if (["entree", "entrer", "valide", "valider"].includes(token)) {
        return { type: "enter", step: 1 };
      }

      if (["efface", "effacer", "annule", "annuler", "retour"].includes(token)) {
        return { type: "erase", step: 1 };
      }

      if (token === "nouvelle" && nextToken === "partie") {
        return { type: "new", step: 2 };
      }

      if (["nouvelle", "reset", "recommence"].includes(token)) {
        return { type: "new", step: 1 };
      }

      return null;
    }

    function parseVoicePhrase(rawText) {
      const normalized = normalizeVoiceText(rawText);
      if (!normalized) return [];

      const tokens = normalized.split(" ");
      const actions = [];

      for (let index = 0; index < tokens.length; index += 1) {
        const action = parseVoiceToken(tokens, index);
        if (!action) continue;

        if (action.type === "sequence") {
          actions.push(...action.actions);
        } else {
          actions.push(action);
        }

        if (action.step === 2) {
          index += 1;
        }
      }

      return actions;
    }

    function scheduleVoiceRestart() {
      if (!voiceEnabled || !voiceRecognition) return;

      window.clearTimeout(voiceRestartTimer);
      voiceRestartTimer = window.setTimeout(() => {
        try {
          voiceRecognition.start();
        } catch (error) {
          updateVoiceUI("error");
        }
      }, 420);
    }

    function startVoiceRecognition() {
      if (!voiceRecognition) {
        updateVoiceUI("error");
        return;
      }

      voiceEnabled = true;
      window.localStorage.setItem("voiceWakeEnabled", "1");
      try {
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
        }
        voiceRecognition.start();
      } catch (error) {
        updateVoiceUI("error");
      }
      updateVoiceUI();
    }

    function stopVoiceRecognition() {
      voiceEnabled = false;
      voiceListening = false;
      voiceArmed = false;
      window.clearTimeout(voiceRestartTimer);
      window.localStorage.removeItem("voiceWakeEnabled");
      if (voiceRecognition) {
        try {
          voiceRecognition.stop();
        } catch (error) {
          // noop
        }
      }
      updateVoiceUI();
    }

    function executeVoiceActions(actions) {
      if (!actions.length) return;

      let hasValueInput = false;

      for (const action of actions) {
        if (action.type === "arm") {
          voiceArmed = true;
          updateVoiceUI();
          continue;
        }

        if (action.type === "value") {
          if (!voiceArmed) {
            continue;
          }

          const availableSlots = MAX_VALUES - currentThrow.length;
          if (availableSlots <= 0) {
            setWarning("Maximum atteint");
            flashCurrentWarning();
            speak("Maximum atteint.");
            return;
          }

          addValue(action.value);
          hasValueInput = true;
          continue;
        }

        if (action.type === "erase") {
          if (!voiceArmed) {
            continue;
          }
          eraseValue();
          speak("Effacé.");
          continue;
        }

        if (action.type === "new") {
          newGame();
          voiceArmed = false;
          updateVoiceUI();
          speak("Nouvelle partie. Trois cent un points.");
          continue;
        }

        if (action.type === "enter") {
          if (!voiceArmed) {
            continue;
          }

          if (!currentThrow.length) {
            speak("Aucun score à entrer.");
            continue;
          }

          const announcedValues = formatThrow(currentThrow);
          const announcedTotal = sum(currentThrow);
          const remainingAfter = score - announcedTotal;

          if (remainingAfter < 0) {
            setWarning("Score impossible");
            flashCurrentWarning();
            speak(`Score impossible. Il reste ${score}.`);
            continue;
          }

          enterThrow();
          voiceArmed = false;
          updateVoiceUI();
          speak(`${announcedValues}. ${announcedTotal} points entrés. Nouveau score ${score}.`);
        }
      }

      if (hasValueInput && voiceArmed) {
        const currentTotal = sum(currentThrow);
        const projectedRemaining = score - currentTotal;
        speak(`${formatThrow(currentThrow)}. Total ${currentTotal}. Il reste ${projectedRemaining}.`);
      }
    }

    function sum(values) {
      return values.reduce((total, value) => total + value, 0);
    }

    function formatThrow(values) {
      return values.length ? values.join("+") : "";
    }

    function animateScore(nextScore) {
      if (scoreAnimation) {
        cancelAnimationFrame(scoreAnimation);
      }

      const startScore = displayedScore;
      const delta = nextScore - startScore;
      const startTime = performance.now();
      const duration = Math.min(520, Math.max(220, Math.abs(delta) * 11));

      scoreEl.classList.remove("score-pop");
      void scoreEl.offsetWidth;
      scoreEl.classList.add("score-pop");

      function tick(now) {
        const progress = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        displayedScore = Math.round(startScore + delta * eased);
        scoreEl.textContent = displayedScore;

        if (progress < 1) {
          scoreAnimation = requestAnimationFrame(tick);
        } else {
          displayedScore = nextScore;
          scoreEl.textContent = nextScore;
          scoreAnimation = null;
        }
      }

      scoreAnimation = requestAnimationFrame(tick);
    }

    function setWarning(message) {
      hintEl.textContent = message;
      hintEl.classList.remove("warn");
      void hintEl.offsetWidth;
      hintEl.classList.add("warn");
      window.setTimeout(() => hintEl.classList.remove("warn"), 280);
    }

    function flashCurrentWarning() {
      currentEl.classList.remove("warn");
      void currentEl.offsetWidth;
      currentEl.classList.add("warn");
      window.setTimeout(() => currentEl.classList.remove("warn"), 320);
    }

    function updateUI(options = {}) {
      const total = sum(currentThrow);
      const projectedScore = score - total;

      if (options.animateScore) {
        animateScore(score);
      } else {
        displayedScore = score;
        scoreEl.textContent = score;
      }

      currentEl.innerHTML = currentThrow.length
        ? `<strong>${formatThrow(currentThrow)}</strong>`
        : "Tour vide";

      if (history) {
        lastThrowEl.textContent = `${formatThrow(history.values)} = ${history.total}`;
      } else {
        lastThrowEl.textContent = "Aucune manche";
      }

      if (projectedScore < 0) {
        hintEl.textContent = `Trop haut de ${Math.abs(projectedScore)}`;
        hintEl.classList.add("warn");
      } else if (currentThrow.length) {
        hintEl.textContent = `Reste ${projectedScore}`;
        hintEl.classList.remove("warn");
      } else if (score === 0) {
        hintEl.textContent = "Reste 0";
        hintEl.classList.remove("warn");
      } else {
        hintEl.textContent = `Reste ${score}`;
        hintEl.classList.remove("warn");
      }
    }

    function addValue(value) {
      vibrate(10);

      if (currentThrow.length >= MAX_VALUES) {
        setWarning("Maximum atteint");
        flashCurrentWarning();
        vibrate([8, 28, 8]);
        return;
      }

      currentThrow.push(value);
      updateUI();
    }

    function enterThrow() {
      vibrate(16);

      if (currentThrow.length === 0) {
        setWarning("Ajoute un score");
        return;
      }

      const total = sum(currentThrow);

      if (total > score) {
        setWarning("Score impossible");
        vibrate([10, 34, 10]);
        return;
      }

      score -= total;
      history = {
        total,
        values: [...currentThrow]
      };
      currentThrow = [];
      updateUI({ animateScore: true });
    }

    function eraseValue() {
      vibrate(8);

      if (currentThrow.length > 0) {
        currentThrow.pop();
        updateUI();
        return;
      }

      if (history) {
        score += history.total;
        currentThrow = [...history.values];
        history = null;
        updateUI({ animateScore: true });
        return;
      }

      setWarning("Rien à effacer");
    }

    function newGame() {
      vibrate([12, 28, 12]);
      score = START_SCORE;
      currentThrow = [];
      history = null;
      voiceArmed = false;
      updateVoiceUI();
      updateUI({ animateScore: true });
    }

    if (voiceRecognition) {
      voiceRecognition.onstart = () => {
        voiceListening = true;
        updateVoiceUI();
      };

      voiceRecognition.onend = () => {
        voiceListening = false;
        updateVoiceUI();
        if (voicePausedForSpeech) {
          return;
        }
        scheduleVoiceRestart();
      };

      voiceRecognition.onerror = () => {
        voiceListening = false;
        if (voicePausedForSpeech) {
          return;
        }
        updateVoiceUI("error");
        scheduleVoiceRestart();
      };

      voiceRecognition.onresult = (event) => {
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const result = event.results[index];
          if (!result.isFinal) continue;

          executeVoiceActions(parseVoicePhrase(result[0].transcript));
        }
      };
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const value = button.dataset.value;
      const action = button.dataset.action;

      if (value) addValue(Number(value));
      if (action === "erase") eraseValue();
      if (action === "enter") enterThrow();
      if (action === "new") newGame();
    });

    document.querySelectorAll(".button").forEach((button) => {
      const release = () => window.setTimeout(() => button.classList.remove("pressed"), 70);

      button.addEventListener("pointerdown", () => button.classList.add("pressed"));
      button.addEventListener("pointerup", release);
      button.addEventListener("pointerleave", release);
      button.addEventListener("pointercancel", () => button.classList.remove("pressed"));
    });

    if (voiceToggleEl) {
      voiceToggleEl.addEventListener("click", () => {
        if (voiceEnabled) {
          stopVoiceRecognition();
        } else {
          startVoiceRecognition();
        }
      });
    }

    if (window.localStorage.getItem("voiceWakeEnabled") === "1" && voiceRecognition) {
      const autoResumeVoice = () => {
        document.removeEventListener("pointerdown", autoResumeVoice);
        startVoiceRecognition();
      };
      document.addEventListener("pointerdown", autoResumeVoice, { once: true });
    }

    updateVoiceUI();
    updateUI();
  </script>
</body>
</html>
